<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT Club Checker</title>

    <link rel="stylesheet"
        href="https://pyscript.net/releases/2025.2.3/core.css">

    <script type="module"
        src="https://pyscript.net/releases/2025.2.3/core.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #ffe6f0;
            font-family: Arial, sans-serif;
            color: #4a2635;
        }

        .container {
            width: 500px;
            margin: 70px auto;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(180, 80, 120, 0.2);
            text-align: center;
        }

        .heart {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #d94f83;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9b687d;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #f3b6cc;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #d94f83;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #e96b9b;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d94f83;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            min-height: 60px;
            background: #fff0f5;
            border-radius: 12px;
            color: #c43f70;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: #9b687d;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">💗</div>

        <h1>ICT Club Checker</h1>

        <p class="subtitle">
            Candidate Verification System
        </p>

        <input
            type="text"
            id="first-name"
            placeholder="First Name">

        <input
            type="text"
            id="last-name"
            placeholder="Last Name">

        <button py-click="check_candidate">
            CHECK CANDIDATE
        </button>

        <div id="result" class="result"></div>

    </div>

    <footer>
        © 2026 ICT Club · Seatwork 2 · 2nd Quarter
    </footer>

    <script type="py" src="main.py"></script>

</body>

</html>
