<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT Club Checker</title>

    <link rel="stylesheet"
        href="https://pyscript.net/releases/2025.2.3/core.css">

    <script type="module"
        src="https://pyscript.net/releases/2025.2.3/core.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #160d14, #080a0e);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding-top: 35px;
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: auto;
            border: 5px solid #ffbd00;
            border-radius: 50%;
            background: #72f5ff;
            box-shadow: 0 0 25px #72f5ff;
        }

        h1 {
            margin-top: 25px;
            margin-bottom: 5px;
            color: #ffb900;
            font-size: 42px;
            letter-spacing: 4px;
        }

        .subtitle {
            color: #aaa;
            letter-spacing: 5px;
        }

        .box {
            width: 520px;
            margin: 45px auto 30px;
            padding: 45px 40px;
            background: #202228;
            border-top: 6px solid #d40024;
            border-left: 2px solid #ffbd00;
            border-right: 2px solid #ffbd00;
            border-bottom: 2px solid #ffbd00;
            border-radius: 18px;
        }

        input {
            width: 100%;
            padding: 18px;
            margin-bottom: 20px;
            background: #0d0e11;
            color: white;
            border: 2px solid #333740;
            border-radius: 8px;
            font-size: 18px;
        }

        input::placeholder {
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 17px;
            background: #c90024;
            color: #ffda45;
            border: 2px solid #ffbd00;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
        }

        button:hover {
            background: #e0002b;
        }

        .result {
            width: 520px;
            min-height: 80px;
            margin: auto;
            padding: 25px;
            background: #152126;
            border-left: 6px solid #68f5ff;
            border-radius: 10px;
            color: #ffcf32;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 18px;
            background: #a90022;
            border-top: 5px solid #ffbd00;
            color: #ddd;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo"></div>

        <h1>ICT CLUB CHECKER</h1>

        <p class="subtitle">CANDIDATE VERIFICATION SYSTEM</p>

        <div class="box">

            <input type="text" id="first-name" placeholder="First Name">

            <input type="text" id="last-name" placeholder="Last Name">

            <button py-click="check_candidate">ENTER</button>

        </div>

        <div id="result" class="result"></div>

    </div>

    <footer>
        © 2026 ICT Club · Seatwork 2 · 2nd Quarter
    </footer>

    <script type="py" src="main.py"></script>

</body>

</html>
